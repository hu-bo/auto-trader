[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "hquant"
version = "0.1.0"
description = "High-performance quantitative trading engine powered by Rust"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "hubo", email = "hubo9@qq.com" }]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["quant", "trading", "indicator", "backtest", "rust"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy>=1.20"]

[project.urls]
Repository = "https://github.com/user/hquant"

[tool.maturin]
features = ["ffi-python"]
manifest-path = "../hquant-rs/Cargo.toml"
python-source = "python"
module-name = "hquant._hquant"
