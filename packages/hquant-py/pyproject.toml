[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hquant"
version = "0.1.0"
description = "High-performance quantitative trading engine powered by Rust"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "hubo", email = "hubo9@qq.com" }]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.maturin]
manifest-path = "../hquant-rs/Cargo.toml"
features = ["ffi-python"]
python-source = "python"
module-name = "hquant._hquant"

