syntax = "proto3";

package exchange;

option go_package = "github.com/hquant/contracts/proto/exchange";

// Exchange Service - 交易下单服务
service ExchangeService {
  // 初始化账户并返回 Token
  rpc InitAccount(InitAccountRequest) returns (InitAccountResponse);

  // 验证 Token
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // 注销账户
  rpc InvalidateToken(InvalidateTokenRequest) returns (InvalidateTokenResponse);

  // 下单
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);

  // 批量下单
  rpc PlaceOrders(PlaceOrdersRequest) returns (PlaceOrdersResponse);

  // 撤单
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);

  // 查询订单
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);

  // 查询订单列表
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);

  // 获取持仓
  rpc GetPositions(GetPositionsRequest) returns (GetPositionsResponse);

  // 同步持仓
  rpc SyncPositions(SyncPositionsRequest) returns (SyncPositionsResponse);

  // 获取余额
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);

  // 获取行情
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);

  // 设置杠杆
  rpc SetLeverage(SetLeverageRequest) returns (SetLeverageResponse);

  // 订单更新流
  rpc SubscribeOrders(SubscribeOrdersRequest) returns (stream OrderUpdate);

  // 策略订单（条件单）
  rpc PlaceStrategyOrder(PlaceStrategyOrderRequest) returns (PlaceStrategyOrderResponse);
  rpc PlaceStrategyOrders(PlaceStrategyOrdersRequest) returns (PlaceStrategyOrdersResponse);
  rpc CancelStrategyOrder(CancelStrategyOrderRequest) returns (CancelStrategyOrderResponse);
  rpc GetStrategyOrder(GetStrategyOrderRequest) returns (GetStrategyOrderResponse);
  rpc GetOpenStrategyOrders(GetOpenStrategyOrdersRequest) returns (GetOpenStrategyOrdersResponse);
}

// ============================================================================
// Common Types
// ============================================================================

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  EXCHANGE_OKX = 1;
  EXCHANGE_BINANCE = 2;
}

enum TradeType {
  TRADE_TYPE_UNSPECIFIED = 0;
  TRADE_TYPE_SPOT = 1;
  TRADE_TYPE_FUTURES = 2;
  TRADE_TYPE_DELIVERY = 3;
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

enum PositionSide {
  POSITION_SIDE_UNSPECIFIED = 0;
  POSITION_SIDE_LONG = 1;
  POSITION_SIDE_SHORT = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_MAKER_ONLY = 3;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_OPEN = 2;
  ORDER_STATUS_PARTIAL = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELED = 5;
  ORDER_STATUS_REJECTED = 6;
  ORDER_STATUS_EXPIRED = 7;
}

message Error {
  string code = 1;
  string message = 2;
}

// ============================================================================
// Account Management
// ============================================================================

message InitAccountRequest {
  Exchange exchange = 1;
  string api_key = 2;
  string api_secret = 3;
  optional string passphrase = 4;  // OKX only
  bool demonet = 5;
  optional string name = 6;
}

message InitAccountResponse {
  bool success = 1;
  string token = 2;
  Error error = 3;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  Exchange exchange = 2;
  Error error = 3;
}

message InvalidateTokenRequest {
  string token = 1;
}

message InvalidateTokenResponse {
  bool success = 1;
}

// ============================================================================
// Order Management
// ============================================================================

message PlaceOrderRequest {
  string token = 1;
  string symbol = 2;
  TradeType trade_type = 3;
  OrderSide side = 4;
  OrderType order_type = 5;
  double quantity = 6;
  optional double price = 7;
  optional PositionSide position_side = 8;
  optional int32 leverage = 9;
  optional string client_order_id = 10;
  optional bool reduce_only = 11;
}

message PlaceOrderResponse {
  bool success = 1;
  Order order = 2;
  Error error = 3;
}

message PlaceOrdersRequest {
  string token = 1;
  repeated PlaceOrderRequest orders = 2;
}

message PlaceOrdersResponse {
  int32 success_count = 1;
  int32 failed_count = 2;
  repeated PlaceOrderResponse results = 3;
}

message CancelOrderRequest {
  string token = 1;
  string order_id = 2;
}

message CancelOrderResponse {
  bool success = 1;
  Order order = 2;
  Error error = 3;
}

message GetOrderRequest {
  string token = 1;
  string order_id = 2;
}

message GetOrderResponse {
  Order order = 1;
  Error error = 2;
}

message GetOrdersRequest {
  string token = 1;
  optional string symbol = 2;
  optional OrderStatus status = 3;
  optional int32 limit = 4;
  optional int32 offset = 5;
}

message GetOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message Order {
  string id = 1;
  string exchange_order_id = 2;
  string client_order_id = 3;
  string symbol = 4;
  TradeType trade_type = 5;
  OrderSide side = 6;
  PositionSide position_side = 7;
  OrderType order_type = 8;
  OrderStatus status = 9;
  string quantity = 10;
  string price = 11;
  string filled_qty = 12;
  string avg_price = 13;
  string fee = 14;
  string fee_asset = 15;
  int32 leverage = 16;
  bool reduce_only = 17;
  int64 created_at = 18;
  int64 updated_at = 19;
  int64 filled_at = 20;
}

// ============================================================================
// Position Management
// ============================================================================

message GetPositionsRequest {
  string token = 1;
  optional string symbol = 2;
}

message GetPositionsResponse {
  repeated Position positions = 1;
}

message SyncPositionsRequest {
  string token = 1;
}

message SyncPositionsResponse {
  bool success = 1;
  repeated Position positions = 2;
  Error error = 3;
}

message Position {
  string id = 1;
  string symbol = 2;
  TradeType trade_type = 3;
  PositionSide position_side = 4;
  string position_amt = 5;
  string entry_price = 6;
  string mark_price = 7;
  string unrealized_pnl = 8;
  string realized_pnl = 9;
  int32 leverage = 10;
  string margin_mode = 11;
  string liquidation_price = 12;
  string margin = 13;
  int64 last_sync_at = 14;
}

// ============================================================================
// Balance
// ============================================================================

message GetBalanceRequest {
  string token = 1;
  TradeType trade_type = 2;
}

message GetBalanceResponse {
  repeated Balance balances = 1;
  Error error = 2;
}

message Balance {
  string asset = 1;
  string free = 2;
  string locked = 3;
  string total = 4;
  string unrealized_pnl = 5;
  string margin_balance = 6;
}

// ============================================================================
// Market Data
// ============================================================================

message GetPriceRequest {
  string token = 1;
  string symbol = 2;
  TradeType trade_type = 3;
}

message GetPriceResponse {
  string price = 1;
  Error error = 2;
}

// ============================================================================
// Leverage
// ============================================================================

message SetLeverageRequest {
  string token = 1;
  string symbol = 2;
  int32 leverage = 3;
  TradeType trade_type = 4;
  optional PositionSide position_side = 5;
}

message SetLeverageResponse {
  bool success = 1;
  Error error = 2;
}

// ============================================================================
// Strategy Orders (Algo / Conditional)
// ============================================================================

enum StrategyOrderType {
  STRATEGY_ORDER_TYPE_UNSPECIFIED = 0;
  STRATEGY_ORDER_TYPE_STOP_LOSS = 1;
  STRATEGY_ORDER_TYPE_TAKE_PROFIT = 2;
  STRATEGY_ORDER_TYPE_TRIGGER = 3;
  STRATEGY_ORDER_TYPE_TRAILING_STOP = 4;
}

enum StrategyTriggerPriceType {
  STRATEGY_TRIGGER_PRICE_TYPE_UNSPECIFIED = 0;
  STRATEGY_TRIGGER_PRICE_TYPE_LAST = 1;
  STRATEGY_TRIGGER_PRICE_TYPE_MARK = 2;
  STRATEGY_TRIGGER_PRICE_TYPE_INDEX = 3;
}

enum StrategyOrderStatus {
  STRATEGY_ORDER_STATUS_UNSPECIFIED = 0;
  STRATEGY_ORDER_STATUS_LIVE = 1;
  STRATEGY_ORDER_STATUS_EFFECTIVE = 2;
  STRATEGY_ORDER_STATUS_CANCELED = 3;
  STRATEGY_ORDER_STATUS_FAILED = 4;
  STRATEGY_ORDER_STATUS_PARTIALLY_EFFECTIVE = 5;
}

message PlaceStrategyOrderRequest {
  string token = 1;
  string symbol = 2;
  TradeType trade_type = 3;
  OrderSide side = 4;
  StrategyOrderType strategy_type = 5;
  double quantity = 6;
  double trigger_price = 7;
  optional PositionSide position_side = 8;
  optional StrategyTriggerPriceType trigger_price_type = 9;
  optional double order_price = 10;
  optional bool reduce_only = 11;
  optional string client_algo_id = 12;
  optional double callback_ratio = 13;
  optional double activation_price = 14;
  optional double sl_trigger_price = 15;
  optional double tp_trigger_price = 16;
}

message PlaceStrategyOrderResponse {
  bool success = 1;
  StrategyOrder order = 2;
  Error error = 3;
}

message PlaceStrategyOrdersRequest {
  string token = 1;
  repeated PlaceStrategyOrderRequest orders = 2;
}

message PlaceStrategyOrdersResponse {
  int32 success_count = 1;
  int32 failed_count = 2;
  repeated PlaceStrategyOrderResponse results = 3;
}

message CancelStrategyOrderRequest {
  string token = 1;
  string symbol = 2;
  string algo_id = 3;
  TradeType trade_type = 4;
}

message CancelStrategyOrderResponse {
  bool success = 1;
  StrategyOrder order = 2;
  Error error = 3;
}

message GetStrategyOrderRequest {
  string token = 1;
  string algo_id = 2;
  TradeType trade_type = 3;
}

message GetStrategyOrderResponse {
  StrategyOrder order = 1;
  Error error = 2;
}

message GetOpenStrategyOrdersRequest {
  string token = 1;
  optional string symbol = 2;
  optional TradeType trade_type = 3;
}

message GetOpenStrategyOrdersResponse {
  repeated StrategyOrder orders = 1;
  Error error = 2;
}

message StrategyOrder {
  string algo_id = 1;
  string client_algo_id = 2;
  string symbol = 3;
  TradeType trade_type = 4;
  OrderSide side = 5;
  PositionSide position_side = 6;
  StrategyOrderType strategy_type = 7;
  StrategyOrderStatus status = 8;
  string trigger_price = 9;
  string trigger_price_type = 10;
  string order_price = 11;
  string quantity = 12;
  string tp_trigger_price = 13;
  string tp_order_price = 14;
  string sl_trigger_price = 15;
  string sl_order_price = 16;
  int64 created_at = 17;
  int64 updated_at = 18;
  int64 triggered_at = 19;
}

// ============================================================================
// Streaming
// ============================================================================

message SubscribeOrdersRequest {
  string token = 1;
  TradeType trade_type = 2;
}

message OrderUpdate {
  string order_id = 1;
  string client_order_id = 2;
  string symbol = 3;
  TradeType trade_type = 4;
  OrderSide side = 5;
  PositionSide position_side = 6;
  OrderType order_type = 7;
  OrderStatus status = 8;
  string price = 9;
  string quantity = 10;
  string filled_quantity = 11;
  string avg_price = 12;
  string fee = 13;
  string fee_asset = 14;
  int64 update_time = 15;
}
