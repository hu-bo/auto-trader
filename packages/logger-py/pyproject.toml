[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hquant-logger"
version = "0.0.2"
description = "High-performance structured logger for hquant services"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hquant_logger"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
