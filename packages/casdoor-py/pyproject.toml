[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casdoor-py"
version = "0.1.0"
description = "Casdoor Python SDK - 服务端认证库，支持 FastAPI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "HQuant Team", email = "team@hquant.com"}
]
keywords = ["casdoor", "auth", "sso", "oauth", "jwt", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Session",
]

dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/hquant/casdoor-py"
Documentation = "https://github.com/hquant/casdoor-py#readme"
Repository = "https://github.com/hquant/casdoor-py"
Issues = "https://github.com/hquant/casdoor-py/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["casdoor_py*"]
