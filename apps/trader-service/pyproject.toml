[tool.poetry]
name = "trader-service"
version = "0.1.0"
description = "Quantitative Trading Platform Service"
authors = ["HQuant Team <team@hquant.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.109.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
python-multipart = "^0.0.6"

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.25" }
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
alembic = "^1.13.1"

# Cache & Message Queue
redis = "^5.0.1"
nats-py = "^2.6.0"

# gRPC
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
protobuf = "^4.25.0"

# Data Validation
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.1"

# Quantitative
hquant = { path = "../../packages/hquant-py", develop = true }
onnxruntime = "^1.16.0"

# Auth
casdoor-py = { path = "../../packages/casdoor-py", develop = true }
pyjwt = { extras = ["crypto"], version = "^2.8.0" }

# Security
cryptography = "^42.0.0"

# Monitoring
prometheus-client = "^0.19.0"

# Utils
python-dateutil = "^2.8.2"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
