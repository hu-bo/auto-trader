version: '3.8'

services:
  nats:
    image: nats:latest
    container_name: exchange-adapter-nats
    ports:
      - "15002:4222"
    command: [ "-js", "--user=exchange_sync", "--pass=123456" ]
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shared_network
  redis:
    image: redis:7-alpine
    container_name: exchange-adapter-redis
    restart: unless-stopped
    ports:
      - "16000:6379"
    volumes:
      - redis_data:/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  exchange-adapter-service:
    image: alpine:3.19
    container_name: exchange-adapter-service
    depends_on:
      - nats
    ports:
      - "9100:9100"
      - "9101:9101"
    restart: always
    volumes:
      - ./:/app
    working_dir: /app
    command: ["/bin/sh", "-lc", "apk add --no-cache ca-certificates tzdata >/dev/null && ./exchange-adapter-service"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep exchange-adapter-service || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:

networks:
  shared_network:
    external: true
