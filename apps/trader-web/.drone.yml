kind: pipeline
type: docker
name: trader-web

trigger:
  branch:
    - master

volumes:
  - name: pnpm-cache
    host:
      path: /var/lib/drone-cache/pnpm/trader-web

steps:

  # 1. 恢复 pnpm store 缓存1
  - name: restore-pnpm-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: pnpm-cache
        path: /cache
    settings:
      restore: true
      mount:
        - /cache/pnpm-store

  # 2. build & package
  - name: build and package
    image: node:20-alpine
    volumes:
      - name: pnpm-cache
        path: /cache
    commands:
      - APP_NAME=trader-web
      - APP_DIR=apps/$APP_NAME
      - APP_DEPLOY_DIR=/drone/src/$APP_NAME-deploy
      - npm install -g pnpm@9
      # 使用 corepack，避免 npm / yarn 污染
      - corepack enable
      - corepack prepare pnpm@9 --activate

      # 强制指定 pnpm store，彻底隔离 npm/yarn
      - pnpm config set store-dir /cache/pnpm-store
      - pnpm config set registry https://registry.npmmirror.com/

      # workspace 依赖安装
      - pnpm -w install --no-frozen-lockfile --filter "$APP_NAME..."
      - cd $APP_DIR
      # 单应用构建
      - pnpm run build
      # 打包
      - tar -czf /drone/src/$APP_NAME.tar.gz ./dist
  # 3. 保存 pnpm store 缓存
  - name: rebuild-pnpm-cache
    image: drillster/drone-volume-cache
    volumes:
      - name: pnpm-cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - /cache/pnpm-store

  # 4. scp
  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: false
      source:
        - trader-web.tar.gz
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /temp/app/

  # 5. deploy
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 2m
      script:
        - APP_NAME=trader-web
        - APP_DIR=/data/app/$APP_NAME
        # 清理旧版本
        - rm -rf $APP_DIR
        - mkdir -p $APP_DIR
        # 解压新版本
        - tar xzf /temp/app/$APP_NAME.tar.gz -C /data/app/$APP_NAME
        - rm -rf /temp/app/$APP_NAME.tar.gz
        # 列出文件，校验部署结果
        - ls -a /data/app/$APP_NAME

