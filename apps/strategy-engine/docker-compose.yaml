version: "3.8"

services:
  nats:
    image: nats:latest
    container_name: strategy-engine-nats
    command: ["-js", "--user=strategy_engine", "--pass=123456"]
    ports:
      - "16001:4222"
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shared_network
  strategy-engine:
    image: strategy-engine:latest
    container_name: strategy-engine
    restart: always
    depends_on:
      nats:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./certs/grpc:/app/certs/grpc:ro
    ports:
      - "9004:9004"
      - "9005:9005"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9004/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shared_network

networks:
  shared_network:
    external: true
