[tool.poetry]
name = "strategy-engine"
version = "1.0.0"
description = "Lightweight Strategy Signal Engine"
authors = ["HQuant Team <team@hquant.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.109.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }

# Message Queue
nats-py = "^2.6.0"

# gRPC
grpcio = ">=1.78.1"
grpcio-tools = ">=1.78.1"

# Data Validation
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.1"

# Quantitative (local editable for dev, CI installs prebuilt wheel and skips directory deps)
hquant = { path = "../../packages/hquant-py", develop = true }

# Numeric
numpy = "^2.1.0"

# HTTP Client
httpx = { extras = ["socks"], version = "^0.27.0" }

# Logging
hquant-logger = { path = "../../packages/logger-py", develop = true }


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
