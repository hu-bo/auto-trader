kind: pipeline
type: docker
name: strategy-engine

trigger:
  branch:
    - master

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

steps:
  # 1. inject-config — SSH 到服务器预创建目录、拉取 .env 和 gRPC 证书
  - name: inject-config
    image: appleboy/drone-ssh
    environment:
      API_CONFIG_TOKEN_SECRET:
        from_secret: API_CONFIG_TOKEN_SECRET
    settings:
      host:
        from_secret: HOST_HONKONG_1
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 2m
      envs:
        - API_CONFIG_TOKEN_SECRET
      script:
        - export APP_NAME=strategy-engine
        - export APP_DIR=/data/app/$APP_NAME
        - mkdir -p $APP_DIR/certs/grpc
        # 拉取 .env 配置
        - 'wget --header="Authorization: Bearer $API_CONFIG_TOKEN_SECRET" "http://config.8and1.cn/api/pull/strategy-engine/env" -O $APP_DIR/.env'
        - echo "=== .env pulled ==="
        - cat $APP_DIR/.env
        # 拉取 gRPC 证书
        - 'wget --header="Authorization: Bearer $API_CONFIG_TOKEN_SECRET" "http://config.8and1.cn/api/pull/certs/grpc/shared.crt" -O $APP_DIR/certs/grpc/shared.crt'
        - 'wget --header="Authorization: Bearer $API_CONFIG_TOKEN_SECRET" "http://config.8and1.cn/api/pull/certs/grpc/shared.key" -O $APP_DIR/certs/grpc/shared.key'
        - echo "=== gRPC certs pulled ==="
        - ls -la $APP_DIR/certs/grpc/

  # 2. build — 使用 docker CLI 执行多阶段构建，构建上下文为仓库根目录
  - name: build
    image: docker:27-cli
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - docker build -f apps/strategy-engine/Dockerfile -t strategy-engine:latest .
      - docker images strategy-engine:latest

  # 3. save-image — docker save 导出镜像为 tar.gz
  - name: save-image
    image: docker:27-cli
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - docker save strategy-engine:latest | gzip > strategy-engine-image.tar.gz
      - ls -lh strategy-engine-image.tar.gz

  # 4. scp — 传输 tar.gz 和 docker-compose.yaml 到服务器
  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: true
      source:
        - strategy-engine-image.tar.gz
        - apps/strategy-engine/docker-compose.yaml
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /temp

  # 5. deploy — SSH 到服务器执行 docker load、docker-compose 重启、健康检查和日志输出
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 5m
      script:
        - export APP_NAME=strategy-engine
        - export APP_DIR=/data/app/$APP_NAME
        # 加载 Docker 镜像
        - docker load < /temp/strategy-engine-image.tar.gz
        - rm -f /temp/strategy-engine-image.tar.gz
        - docker images strategy-engine:latest
        # 复制 docker-compose.yaml
        - cp /temp/apps/strategy-engine/docker-compose.yaml $APP_DIR/docker-compose.yaml
        - cd $APP_DIR
        # 重启服务
        - docker-compose up -d --no-recreate nats redis
        - docker-compose up -d --force-recreate --no-deps strategy-engine
        # 健康检查
        - sleep 5
        - 'curl -sf http://localhost:9004/health && echo " === Health check passed ===" || echo " === Health check failed ==="'
        # 输出日志
        - docker logs --tail 50 strategy-engine
