kind: pipeline
type: docker
name: strategy-engine

trigger:
  branch:
    - master

volumes:
  - name: pip-cache
    host:
      path: /var/lib/drone-cache/pip
  - name: cargo-cache
    host:
      path: /var/lib/drone-cache/cargo

steps:

# -------------------------------------------------
# 1️⃣ 构建 Rust 扩展 (hquant-py)1
# -------------------------------------------------
  - name: build-hquant
    image: ghcr.io/pyo3/maturin:latest
    environment:
      CARGO_HOME: /root/.cargo
    volumes:
      - name: cargo-cache
        path: /root/.cargo/git
    commands:
      - echo "== Building hquant wheel =="
      - cd packages/hquant-py
      - maturin build --release --strip -i /opt/python/cp312-cp312/bin/python -o /drone/src/wheels 
      - ls -lah /drone/src/wheels

# -------------------------------------------------
# 2️⃣ 构建 Python 服务
# -------------------------------------------------
  - name: build-service
    image: python:3.12-slim
    environment:
      POETRY_VERSION: "2.3.2"
    volumes:
      - name: pip-cache
        path: /root/.cache
    commands:
      - echo "== Installing build deps =="
      - apt-get update && apt-get install -y --no-install-recommends \
          build-essential git curl && \
        rm -rf /var/lib/apt/lists/*

      - pip install --no-cache-dir "poetry==$POETRY_VERSION"
      - pip install --no-cache-dir poetry-plugin-export

      - echo "== Build local wheels =="
      - pip wheel ./packages/logger-py -w /drone/src/wheels

      - echo "== Build service wheel =="
      - cd apps/strategy-engine
      - poetry build -f wheel -n
      - poetry export --only main -f requirements.txt --without-hashes -o /drone/src/requirements.txt
      - sed -i '/^hquant[=<>@ ]/d;/^hquant-logger[=<>@ ]/d;/packages\\/hquant-py/d;/packages\\/logger-py/d' /drone/src/requirements.txt

      - echo "== Package release artifact =="
      - cd /drone/src
      - mkdir -p release/strategy-engine/dist release/strategy-engine/wheels
      - cp /drone/src/requirements.txt release/strategy-engine/requirements.txt
      - cp apps/strategy-engine/pyproject.toml release/strategy-engine/
      - cp apps/strategy-engine/poetry.lock release/strategy-engine/
      - cp -r apps/strategy-engine/app release/strategy-engine/
      - cp apps/strategy-engine/dist/strategy_engine-*.whl release/strategy-engine/dist/
      - cp wheels/hquant-*.whl release/strategy-engine/wheels/
      - cp wheels/hquant_logger-*.whl release/strategy-engine/wheels/
      - cp apps/strategy-engine/Dockerfile release/strategy-engine/
      - cp apps/strategy-engine/docker-compose.yaml release/strategy-engine/
      - cp apps/strategy-engine/.env.example release/strategy-engine/
      - cp -r packages release/strategy-engine/
      - tar czf strategy-engine.tar.gz -C release/strategy-engine .

# -------------------------------------------------
# 3️⃣ SCP 上传1
# -------------------------------------------------
  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: false
      source:
        - strategy-engine.tar.gz
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /temp

# -------------------------------------------------
# 4️⃣ 远程部署
# -------------------------------------------------
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 10m
      script:
        - export APP_NAME=strategy-engine
        - mkdir -p /data/app/$APP_NAME
        - rm -rf /data/app/$APP_NAME/*
        - tar xzf /temp/strategy-engine.tar.gz -C /data/app/$APP_NAME
        - cd /data/app/$APP_NAME
        - ls -la
        - docker-compose -f docker-compose.yaml up -d --build --force-recreate
        - sleep 2
        - docker logs --tail 200 strategy-engine
